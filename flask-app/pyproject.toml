[project]
name = "fpforce-calculator"
version = "0.1.0"
description = "A calculator for seismic forces in nonstructural components"
authors = [
    {name = "Andrew Lozovoy", email = "your.email@example.com"}
]
dependencies = [
    "flask==2.3.3",
    "gunicorn==21.2.0",
    "python-dotenv==1.0.0"
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true 