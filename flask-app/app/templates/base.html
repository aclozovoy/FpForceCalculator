<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}ASCE 7-22 Nonstructural Seismic Force Calculator{% endblock %}</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            darkgreen: '#1a4d1a',
                            accent: '#ff8c00',
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        {% block head %}{% endblock %}
    </head>
    <body class="bg-white min-h-screen flex flex-col">
        <nav class="bg-darkgreen shadow-lg">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center">
                            <a href="/" class="text-xl font-bold text-white hover:text-accent transition-colors">FpForce.net</a>
                        </div>
                        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                            <a href="/" class="{% if request.endpoint == 'views.main' %}border-accent text-white{% else %}border-transparent text-white hover:border-accent hover:text-accent{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
                                Calculator
                            </a>
                            <a href="/about" class="{% if request.endpoint == 'views.about' %}border-accent text-white{% else %}border-transparent text-white hover:border-accent hover:text-accent{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
                                About
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="bg-black shadow mt-auto">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-white text-sm">
                    &copy; 2024 FpForce.net. All rights reserved.
                </p>
            </div>
        </footer>

        {% block scripts %}{% endblock %}
    </body>
</html>
