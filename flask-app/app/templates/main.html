{% extends "base.html" %}
{% block title %}FpForce.net{% endblock %}



{% block content %}
<div class="bg-white shadow rounded-lg p-6">
	<h1 class="text-2xl font-bold text-gray-900 mb-6">ASCE 7-22 Nonstructural Seismic Force Calculator</h1>
	
	<form id="calculatorForm" class="space-y-6">
		<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
			<!-- Component Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Component Parameters</h2>
				
				<div>
					<label for="Wp" class="block text-sm font-medium text-gray-700">W<sub>p</sub></label>
					<input type="number" step="0.001" id="Wp" name="Wp" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="IpRadio" class="block text-sm font-medium text-gray-700">I<sub>p</sub></label>
					<select id="IpRadio" name="IpRadio" required
							class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<option value="1">1.0</option>
						<option value="1.5">1.5</option>
					</select>
				</div>

				<div>
					<label for="CompNum" class="block text-sm font-medium text-gray-700">Architectural Component</label>
					<select id="CompNum" name="CompNum" required
							class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<option value="">Select a component...</option>
						<optgroup label="Interior nonstructural walls and partitions">
							<option value="1">Light frame < 9 ft (2.74 m) in height</option>
							<option value="2">Light frame > 9 ft (2.74 m) in height</option>
							<option value="3">Reinforced masonry</option>
							<option value="4">All other walls and partitions</option>
						</optgroup>
						<optgroup label="Cantilever elements (unbraced or braced to structure below its center of mass)">
							<option value="5">Parapets and cantilever interior nonstructural walls</option>
							<option value="6">Chimneys where laterally braced or supported by the structural frame</option>
						</optgroup>
						<optgroup label="Cantilever elements (braced to structural frame above its center of mass)">
							<option value="7">Parapets</option>
							<option value="8">Chimneys</option>
							<option value="9">Exterior nonstructural walls</option>
						</optgroup>
						<optgroup label="Exterior nonstructural wall elements and connections">
							<option value="10">Wall element</option>
							<option value="11">Body of wall panel connections</option>
							<option value="12">Fasteners of the connecting system</option>
						</optgroup>
						<optgroup label="Veneer">
							<option value="13">Limited-deformability elements and attachments</option>
							<option value="14">Low-deformability elements and attachments</option>
						</optgroup>
						<optgroup label="Penthouses">
							<option value="15">Seismic Force-Resisting Systems with R > 6</option>
							<option value="16">Seismic Force-Resisting Systems with 4 < R < 6</option>
							<option value="17">Seismic Force-Resisting Systems with R < 4</option>
							<option value="18">Other Systems</option>
						</optgroup>
						<optgroup label="Ceilings">
							<option value="19">All</option>
						</optgroup>
						<optgroup label="Cabinets">
							<option value="20">Permanent floor-supported storage cabinets > 6 ft</option>
							<option value="21">Permanent floor-supported library shelving > 6 ft</option>
							<option value="22">Laboratory equipment</option>
						</optgroup>
						<optgroup label="Access Floors">
							<option value="23">Special access floors</option>
							<option value="24">All other</option>
						</optgroup>
						<optgroup label="Other Components">
							<option value="25">Appendages and ornamentations</option>
							<option value="26">Signs and billboards</option>
							<option value="27">Other rigid components</option>
							<option value="28">High-deformability elements and attachments</option>
							<option value="29">Limited-deformability elements and attachments</option>
							<option value="30">Low-deformability materials and attachments</option>
							<option value="31">Egress stairways not part of the building seismic force-resisting system</option>
							<option value="32">Egress stairs and ramp fasteners and attachments</option>
						</optgroup>
					</select>
				</div>

				<div class="grid grid-cols-3 gap-4">
					<div>
						<label for="Car" class="block text-sm font-medium text-gray-700">C<sub>ar</sub></label>
						<input type="number" step="0.01" id="Car" name="Car" required readonly
							   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
					</div>

					<div>
						<label for="Rpo" class="block text-sm font-medium text-gray-700">R<sub>po</sub></label>
						<input type="number" step="0.01" id="Rpo" name="Rpo" required readonly
							   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
					</div>

					<div>
						<label for="Oop" class="block text-sm font-medium text-gray-700">Ω<sub>op</sub></label>
						<input type="number" step="0.01" id="Oop" name="Oop" required readonly
							   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
					</div>
				</div>
			</div>

			<!-- Structural Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Structural Parameters</h2>
				
				<div>
					<label for="Sds" class="block text-sm font-medium text-gray-700">S<sub>DS</sub></label>
					<input type="number" step="0.001" id="Sds" name="Sds" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="R" class="block text-sm font-medium text-gray-700">R</label>
					<input type="number" step="0.001" id="R" name="R" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Omega0" class="block text-sm font-medium text-gray-700">Ω<sub>0</sub></label>
					<input type="number" step="0.001" id="Omega0" name="Omega0" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Rmu" class="block text-sm font-medium text-gray-700">R<sub>μ</sub></label>
					<input type="number" step="0.001" id="Rmu" name="Rmu" readonly
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
				</div>
			</div>

			<!-- Height Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Height Parameters</h2>
				
				<div>
					<label for="HfRadio" class="block text-sm font-medium text-gray-700">H<sub>f</sub> Type</label>
					<select id="HfRadio" name="HfRadio" required
							class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<option value="PeriodKnown">Supported above grade (period known)</option>
						<option value="PeriodUnknown">Supported above grade (period unknown)</option>
						<option value="BelowGrade">Supported at or below grade</option>
					</select>
				</div>

				<div id="ZInput">
					<label for="z" class="block text-sm font-medium text-gray-700">z</label>
					<input type="number" step="0.001" id="z" name="z" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div id="HInput">
					<label for="h" class="block text-sm font-medium text-gray-700">h</label>
					<input type="number" step="0.001" id="h" name="h" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div id="TaInput">
					<label for="Ta" class="block text-sm font-medium text-gray-700">T<sub>a</sub></label>
					<input type="number" step="0.001" id="Ta" name="Ta" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Hf" class="block text-sm font-medium text-gray-700">H<sub>f</sub></label>
					<input type="number" step="0.001" id="Hf" name="Hf" readonly
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
				</div>
			</div>
		</div>

		<!-- Fp Force Section -->
		<div class="space-y-4">
			<h2 class="text-lg font-semibold text-gray-700">Fp Force</h2>
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<label for="Fp" class="block text-sm font-medium text-gray-700">F<sub>p</sub></label>
					<input type="number" step="0.001" id="Fp" name="Fp" readonly
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
				</div>

				<div>
					<label for="OopFp" class="block text-sm font-medium text-gray-700">Ω<sub>op</sub>F<sub>p</sub></label>
					<input type="number" step="0.001" id="OopFp" name="OopFp" readonly
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100">
				</div>
			</div>
		</div>

		<div class="flex justify-end space-x-4">
			<button type="button" id="printButton" class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" disabled>
				Print Results
			</button>
			<button type="submit"
					class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-darkgreen hover:bg-accent focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent transition-colors">
				Calculate
			</button>
		</div>
	</form>

	<!-- Results Section -->
	<div id="results" class="mt-8 hidden">
		<h2 class="text-lg font-semibold text-gray-700 mb-4">Results</h2>
		<div class="bg-gray-50 rounded-lg p-4">
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<p class="text-sm text-gray-500">F<sub>p</sub></p>
					<p id="result-Fp" class="text-lg font-semibold text-gray-900"></p>
				</div>
				<div>
					<p class="text-sm text-gray-500">Ω<sub>op</sub>F<sub>p</sub></p>
					<p id="result-OopFp" class="text-lg font-semibold text-gray-900"></p>
				</div>
				<div>
					<p class="text-sm text-gray-500">H<sub>f</sub></p>
					<p id="result-Hf" class="text-lg font-semibold text-gray-900"></p>
				</div>
				<div>
					<p class="text-sm text-gray-500">R<sub>μ</sub></p>
					<p id="result-Rmu" class="text-lg font-semibold text-gray-900"></p>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Handle architectural component selection
document.getElementById('CompNum').addEventListener('change', function() {
	const componentName = this.options[this.selectedIndex].text;
	if (componentName && componentName !== 'Select a component...') {
		// Make an AJAX call to get the component parameters
		fetch('/get_component_params', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json',
			},
			body: JSON.stringify({ component_name: componentName })
		})
		.then(response => response.json())
		.then(data => {
			if (data.success) {
				// Update the input fields with the component parameters
				document.getElementById('Car').value = data.params.Car;
				document.getElementById('Rpo').value = data.params.Rpo;
				document.getElementById('Oop').value = data.params.Oop;
			}
		})
		.catch(error => {
			console.error('Error getting component parameters:', error);
		});
	} else {
		// Clear the fields if no component is selected
		document.getElementById('Car').value = '';
		document.getElementById('Rpo').value = '';
		document.getElementById('Oop').value = '';
	}
});

// Function to calculate Rmu
function calculateRmu() {
	const R = parseFloat(document.getElementById('R').value);
	const Omega0 = parseFloat(document.getElementById('Omega0').value);

	if (R > 0 && Omega0 > 0) {
		const Rmu = Math.pow(1.1 * R / Omega0, 0.5);
		document.getElementById('Rmu').value = Rmu.toFixed(2);
		document.getElementById('result-Rmu').textContent = `Rμ = ${Rmu.toFixed(2)}`;
		document.getElementById('result-Rmu').parentElement.parentElement.classList.remove('hidden');
	} else {
		document.getElementById('Rmu').value = '';
		document.getElementById('result-Rmu').textContent = '';
	}
}

// Function to calculate Hf
function calculateHf() {
	const z = parseFloat(document.getElementById('z').value);
	const h = parseFloat(document.getElementById('h').value);
	const Ta = parseFloat(document.getElementById('Ta').value);
	const HfRadio = document.getElementById('HfRadio').value;

	if (z > 0 && h > 0 && Ta > 0 && HfRadio === 'PeriodKnown') {
		const a1 = Math.min(1/Ta, 2.5);
		const a2 = Math.max(1 - Math.pow(0.4/Ta, 2), 0);
		const Hf = 1 + a1 * (z/h) + a2 * Math.pow(z/h, 10);
		document.getElementById('Hf').value = Hf.toFixed(2);
		document.getElementById('result-Hf').textContent = `Hf = ${Hf.toFixed(2)} (a1 = ${a1.toFixed(2)}, a2 = ${a2.toFixed(2)})`;
		document.getElementById('result-Hf').parentElement.parentElement.classList.remove('hidden');
	} else if (z > 0 && h > 0 && HfRadio === 'PeriodUnknown') {
		const Hf = 1 + 2.5 * (z/h);
		document.getElementById('Hf').value = Hf.toFixed(2);
		document.getElementById('result-Hf').textContent = `Hf = ${Hf.toFixed(2)}`;
		document.getElementById('result-Hf').parentElement.parentElement.classList.remove('hidden');
	} else if (HfRadio === 'BelowGrade') {
		const Hf = 1;
		document.getElementById('Hf').value = Hf.toFixed(2);
		document.getElementById('result-Hf').textContent = 'Hf = 1.00';
		document.getElementById('result-Hf').parentElement.parentElement.classList.remove('hidden');
	} else {
		document.getElementById('Hf').value = '';
		document.getElementById('result-Hf').textContent = '';
	}
}

// Function to calculate Fp and OopFp
function calculateFp() {
	console.log('Calculating Fp...');
	const Sds = parseFloat(document.getElementById('Sds').value);
	const Wp = parseFloat(document.getElementById('Wp').value);
	const IpRadio = document.getElementById('IpRadio').value;
	const Rmu = parseFloat(document.getElementById('Rmu').value);
	const Hf = parseFloat(document.getElementById('Hf').value);
	const Car = parseFloat(document.getElementById('Car').value);
	const Rpo = parseFloat(document.getElementById('Rpo').value);
	const Oop = parseFloat(document.getElementById('Oop').value);

	console.log('Input values:', { Sds, Wp, IpRadio, Rmu, Hf, Car, Rpo, Oop });

	if (Sds > 0 && Wp > 0 && Rmu > 0 && Hf > 0 && Car > 0 && Rpo > 0 && Oop > 0) {
		const Ip = parseFloat(IpRadio);
		const X = Math.min(Math.max((Hf/Rmu) * (Car/Rpo), 0.3), 1.6);
		const Fp = X * Sds * Ip * Wp;
		const OopFp = Oop * Fp;

		console.log('Calculated values:', { X, Fp, OopFp });

		document.getElementById('Fp').value = Fp.toFixed(1);
		document.getElementById('OopFp').value = OopFp.toFixed(1);
		document.getElementById('result-Fp').textContent = `Fp = ${Fp.toFixed(1)} lbs`;
		document.getElementById('result-OopFp').textContent = `Ω<sub>op</sub>F<sub>p</sub> = ${OopFp.toFixed(1)} lbs`;
		document.getElementById('result-Fp').parentElement.parentElement.classList.remove('hidden');
		document.getElementById('result-OopFp').parentElement.parentElement.classList.remove('hidden');
	} else {
		console.log('Missing required values for Fp calculation');
		document.getElementById('Fp').value = '';
		document.getElementById('OopFp').value = '';
		document.getElementById('result-Fp').textContent = '';
		document.getElementById('result-OopFp').textContent = '';
	}
}

// Add event listeners for Fp calculation
document.getElementById('Sds').addEventListener('input', calculateFp);
document.getElementById('Wp').addEventListener('input', calculateFp);
document.getElementById('IpRadio').addEventListener('change', calculateFp);
document.getElementById('Rmu').addEventListener('input', calculateFp);
document.getElementById('Hf').addEventListener('input', calculateFp);
document.getElementById('Car').addEventListener('input', calculateFp);
document.getElementById('Rpo').addEventListener('input', calculateFp);
document.getElementById('Oop').addEventListener('input', calculateFp);

// Update existing event listeners to also trigger Fp calculation
document.getElementById('R').addEventListener('input', () => {
	calculateRmu();
	calculateFp();
});
document.getElementById('Omega0').addEventListener('input', () => {
	calculateRmu();
	calculateFp();
});
document.getElementById('HfRadio').addEventListener('change', () => {
	calculateHf();
	calculateFp();
});
document.getElementById('z').addEventListener('input', () => {
	calculateHf();
	calculateFp();
});
document.getElementById('h').addEventListener('input', () => {
	calculateHf();
	calculateFp();
});
document.getElementById('Ta').addEventListener('input', () => {
	calculateHf();
	calculateFp();
});

// Handle form submission
document.getElementById('calculatorForm').addEventListener('submit', async (e) => {
	e.preventDefault();
	
	const formData = new FormData(e.target);
	const data = Object.fromEntries(formData.entries());
	
	try {
		const response = await fetch('/calculate', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json',
			},
			body: JSON.stringify(data)
		});
		const result = await response.json();
		
		if (result.success) {
			document.getElementById('results').classList.remove('hidden');
			document.getElementById('result-Fp').textContent = result.results.FpText;
			document.getElementById('result-OopFp').textContent = `${result.results.OopFp} lbs`;
			document.getElementById('result-Hf').textContent = result.results.HfText;
			document.getElementById('result-Rmu').textContent = result.results.RmuText;
			document.getElementById('printButton').disabled = false;
		}
	} catch (error) {
		console.error('Error:', error);
	}
});

// Handle print button click
document.getElementById('printButton').addEventListener('click', function() {
	const formData = new FormData(document.getElementById('calculatorForm'));
	const params = new URLSearchParams(formData);
	window.open(`/printout?${params.toString()}`, '_blank');
});
</script>
{% endblock %}
