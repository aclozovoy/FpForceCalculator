{% extends "base.html" %}
{% block title %}FpForce.net{% endblock %}



{% block content %}
<div class="bg-white shadow rounded-lg p-6">
	<h1 class="text-2xl font-bold text-gray-900 mb-6">FpForce Calculator</h1>
	
	<form id="calculatorForm" class="space-y-6">
		<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
			<!-- Basic Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Basic Parameters</h2>
				
				<div>
					<label for="Sds" class="block text-sm font-medium text-gray-700">Sds</label>
					<input type="number" step="0.001" id="Sds" name="Sds" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Wp" class="block text-sm font-medium text-gray-700">Wp</label>
					<input type="number" step="0.001" id="Wp" name="Wp" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>
			</div>

			<!-- Component Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Component Parameters</h2>
				
				<div>
					<label for="CompNum" class="block text-sm font-medium text-gray-700">Component Number</label>
					<select id="CompNum" name="CompNum" required
							class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
					</select>
				</div>

				<div>
					<label for="IpRadio" class="block text-sm font-medium text-gray-700">Ip</label>
					<select id="IpRadio" name="IpRadio" required
							class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<option value="1">1.0</option>
						<option value="1.5">1.5</option>
					</select>
				</div>
			</div>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
			<!-- Structural Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Structural Parameters</h2>
				
				<div>
					<label for="R" class="block text-sm font-medium text-gray-700">R</label>
					<input type="number" step="0.1" id="R" name="R" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Omega0" class="block text-sm font-medium text-gray-700">Ω0</label>
					<input type="number" step="0.01" id="Omega0" name="Omega0" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>
			</div>

			<!-- Additional Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Additional Parameters</h2>
				
				<div>
					<label for="Car" class="block text-sm font-medium text-gray-700">Car</label>
					<input type="number" step="0.01" id="Car" name="Car" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Rpo" class="block text-sm font-medium text-gray-700">Rpo</label>
					<input type="number" step="0.01" id="Rpo" name="Rpo" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Oop" class="block text-sm font-medium text-gray-700">Oop</label>
					<input type="number" step="0.01" id="Oop" name="Oop" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>
			</div>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
			<!-- Height Parameters -->
			<div class="space-y-4">
				<h2 class="text-lg font-semibold text-gray-700">Height Parameters</h2>
				
				<div>
					<label for="HfRadio" class="block text-sm font-medium text-gray-700">Hf Type</label>
					<select id="HfRadio" name="HfRadio" required
							class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
						<option value="1">Type 1</option>
						<option value="2">Type 2</option>
					</select>
				</div>

				<div>
					<label for="z" class="block text-sm font-medium text-gray-700">z</label>
					<input type="number" step="0.001" id="z" name="z" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="h" class="block text-sm font-medium text-gray-700">h</label>
					<input type="number" step="0.001" id="h" name="h" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>

				<div>
					<label for="Ta" class="block text-sm font-medium text-gray-700">Ta</label>
					<input type="number" step="0.001" id="Ta" name="Ta" required
						   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
				</div>
			</div>
		</div>

		<div class="flex justify-end">
			<button type="submit"
					class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
				Calculate
			</button>
		</div>
	</form>

	<!-- Results Section -->
	<div id="results" class="mt-8 hidden">
		<h2 class="text-lg font-semibold text-gray-700 mb-4">Results</h2>
		<div class="bg-gray-50 rounded-lg p-4">
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<p class="text-sm text-gray-500">Fp</p>
					<p id="result-Fp" class="text-lg font-semibold text-gray-900"></p>
				</div>
				<div>
					<p class="text-sm text-gray-500">OopFp</p>
					<p id="result-OopFp" class="text-lg font-semibold text-gray-900"></p>
				</div>
				<div>
					<p class="text-sm text-gray-500">Hf</p>
					<p id="result-Hf" class="text-lg font-semibold text-gray-900"></p>
				</div>
				<div>
					<p class="text-sm text-gray-500">Rmu</p>
					<p id="result-Rmu" class="text-lg font-semibold text-gray-900"></p>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('calculatorForm').addEventListener('submit', async (e) => {
	e.preventDefault();
	
	const formData = new FormData(e.target);
	const data = Object.fromEntries(formData.entries());
	
	try {
		const response = await fetch('/calculate', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json',
			},
			body: JSON.stringify(data)
		});
		
		const result = await response.json();
		
		if (result.success) {
			document.getElementById('results').classList.remove('hidden');
			
			// Update results
			document.getElementById('result-Fp').textContent = result.results.Fp;
			document.getElementById('result-OopFp').textContent = result.results.OopFp;
			document.getElementById('result-Hf').textContent = result.results.Hf;
			document.getElementById('result-Rmu').textContent = result.results.Rmu;
		} else {
			alert('Error: ' + result.error);
		}
	} catch (error) {
		alert('Error calculating results: ' + error.message);
	}
});
</script>
{% endblock %}
